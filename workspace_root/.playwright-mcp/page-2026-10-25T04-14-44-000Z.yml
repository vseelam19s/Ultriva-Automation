                    - paragraph [ref=f21e425]:
                      - strong [ref=f21e426]: "Scope:"
                      - text: "488 pages in scope. A further 169 pages were inventoried and ruled out as not applicable (dead code, partials that ride inside a migrated host page, print-only views). Tracker: AG Grid migration tracker workbook maintained by Dani, snapshot 2026-10-19 (data last updated 2026-10-13)."
                    - paragraph [ref=f21e427]:
                      - strong [ref=f21e428]: "Status at creation:"
                      - text: "479 of 488 pages migrated (98.2%). Work started around August 2026 (first migration recorded 2026-08-05, last 2026-09-23 in the tracker). QA is being done on the POC instance, deliberately not yet on the official QA server: 231 pages have a recorded pass from the automated harness, 3 failed, 116 could not be exercised by the harness, 129 have no QA recorded. Nothing here has passed the official QA stage."
                    - paragraph [ref=f21e429]: This issue was created on 2026-10-19 to reflect work already in flight. It is not backdated and has no work logged before that date.
