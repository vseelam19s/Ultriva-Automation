[pytest]
# Configures the root directory for test discovery using relative paths
testpaths = tests

# Add the qa_automation directory to the python path to resolve deep nested package imports
pythonpath =
    .
    tests/QALS11

# Standard naming conventions for discovery
python_files =
    test_*.py
    *_test.py
    Accept*.py
    consolShip.py
    BussinessUnit.py
    DropOffLocation.py
    ManageTolerancePercentage.py
    Shifts.py
    NewItemCreationandAdjustLoopSize.py
    Recall.py
    RescheduleRequest.py
    Reshchedule.py
    Set Ready To Ship Date.py
    Shipping Schedule.py
    users_backup.py
python_classes = Test*
python_functions =
    test_*
    tc_*

# Kept standard environment and report folders ignored.
norecursedirs = .git .venv .pytest_cache

# Execution options for verbose formatting and HTML reporting
addopts =
    -v
    --continue-on-collection-errors
    --tb=short